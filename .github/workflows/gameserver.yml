name: Eaglercraft Server Workflow

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Start Game Server and Keep Alive
        run: |
          # 1. Force execution directly from the absolute workspace root path
          cd ${{ github.workspace }}
          
          # List the files out in logs to verify exact placement and names
          echo "Current working directory contents:"
          ls -la
          
          # Launch using the explicit current directory pathing token
          java -Xmx2G -Xms2G -jar ./EaglerXRewind.jar nogui &
          
          # 2. Wait for the server port to open
          echo "Waiting for Eaglercraft server to bind to port..."
          until nc -z localhost 25565; do
            printf '.'
            sleep 3
          done
          echo "Server is successfully running on localhost!"
          
          # 3. Force the runner to stay online permanently
          tail -f /dev/null
