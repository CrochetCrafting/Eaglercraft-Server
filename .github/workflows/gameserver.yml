name: Eaglercraft Permanent Server

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Start Game Server and Inject Permanent Proxy
        run: |
          cd ${{ github.workspace }}
          
          # 1. Force EULA to true
          echo "eula=true" > eula.txt

          # 2. Force server.properties configuration to offline mode
          if [ -f server.properties ]; then
            sed -i 's/server-ip=.*/server-ip=0.0.0.0/g' server.properties
            sed -i 's/online-mode=.*/online-mode=false/g' server.properties
          fi

          # 3. Temporarily remove AuthMe so it doesn't reject handshakes
          if [ -d plugins ]; then
            rm -f plugins/AuthMe*.jar
            rm -f plugins/authme*.jar
          fi

          # 4. Make your launch script executable and boot the server
          chmod +x ./run.sh
          ./run.sh &
          
          # 5. Wait until the server is fully booted on port 25565
          echo "Waiting for Paper server to bind to port 25565..."
          until nc -z 127.0.0.1 25565; do
            printf '.'
            sleep 3
          done
          echo "Base server is successfully running!"

          # 6. Use a high-performance open-source WebSocket translation engine
          # This acts as an automated bridge that converts web requests into local TCP traffic
          curl -sL https://github.com | tar xz
          cd frp_0.54.0_linux_amd64
          
          # Configure a clean translation link profile targeting your server's native port
          cat << 'EOF' > frpc.toml
          serverAddr = "v1.frp.one"
          serverPort = 7000

          [[proxies]]
          name = "eagler-permanent-runner"
          type = "tcp"
          localIP = "127.0.0.1"
          localPort = 25565
          remotePort = 25565
          EOF

          # Run the pipeline translator configuration in the background
          ./frpc -c frpc.toml > frp.log 2>&1 &
          sleep 5

          echo "=================================================="
          echo "YOUR PERMANENT EAGLERCRAFT SERVER IS LIVE!"
          echo "Copy and paste this link into your client browser:"
          echo "wss://v1.frp.one:25565"
          echo "=================================================="

      # 7. FORCE RUNNER TO STAY ONLINE PERMANENTLY
      - name: Keep Server Alive Permanent
        run: tail -f /dev/null