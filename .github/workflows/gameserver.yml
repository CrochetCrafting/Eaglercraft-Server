name: Eaglercraft Permanent Server

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Start Game Server and Inject Tunnel
        run: |
          cd ${{ github.workspace }}
          
          # 1. Force EULA to true so it doesn't crash on boot
          echo "eula=true" > eula.txt

          # 2. Make your launch script executable and boot the server
          chmod +x ./run.sh
          ./run.sh &
          
          # 3. Wait until the server is fully booted on port 25565
          echo "Waiting for Eaglercraft to bind to port 25565..."
          until nc -z localhost 25565; do
            printf '.'
            sleep 3
          done
          echo "Server is successfully running on localhost!"

          # 4. Use standard background loops to pull a serveo.net web socket bridge url
          # This completely bypasses interactive ssh terminal lockouts
          ssh -R 80:localhost:25565 -o StrictHostKeyChecking=no serveo.net > serveo.log 2>&1 &
          
          # Give the background loop 10 seconds to fetch and log the allocated subdomain URL
          sleep 10
          
          # 5. Extract the secure HTTPS link and transform it into an Eagler wss:// link
          HTTPS_LINK=$(grep -oE 'https://[a-zA-Z0-9.-]+\.serveo\.net' serveo.log | head -n 1)
          WSS_LINK=$(echo "$HTTPS_LINK" | sed 's/https:\/\//wss:\/\//')

          # Backup check: If the log format varies, print the raw output file to manually check it
          if [ -z "$WSS_LINK" ]; then
            echo "--- RAW TUNNEL LOG FOR MANUAL BACKUP ---"
            cat serveo.log
            echo "----------------------------------------"
          fi

          echo "=================================================="
          echo "YOUR PERMANENT EAGLERCRAFT SERVER IS LIVE!"
          echo "Copy and paste this link into your client browser:"
          echo "$WSS_LINK"
          echo "=================================================="

      # 6. FORCE RUNNER TO STAY ONLINE PERMANENTLY
      - name: Keep Server Alive Permanent
        run: tail -f /dev/null