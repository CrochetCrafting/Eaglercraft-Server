name: Eaglercraft Permanent Server

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Node.js for LocalTunnel
        uses: actions/setup-node@v4
        with:
          node-node-version: '20'

      - name: Start Game Server and Setup Secure Tunnel
        run: |
          cd ${{ github.workspace }}
          
          # 1. Force EULA to true so it doesn't crash on boot
          echo "eula=true" > eula.txt

          # 2. Make your launch script executable and boot the server
          chmod +x ./run.sh
          ./run.sh &
          
          # 3. Wait until the server is fully booted on port 25565
          echo "Waiting for Eaglercraft to bind to port 25565..."
          until nc -z localhost 25565; do
            printf '.'
            sleep 3
          done
          echo "Server is successfully running on localhost!"

          # 4. Install localtunnel globally
          npm install -g localtunnel

          # 5. Start the tunnel on port 25565 and save the link output
          # LocalTunnel provides a completely valid SSL certificate that web browsers accept
          lt --port 25565 > localtunnel.log 2>&1 &
          
          # Give the tunnel a few seconds to connect to the cloud server
          sleep 8
          
          # 6. Extract the unique secure URL assigned to your runner
          HTTP_LINK=$(grep -oE 'https://[a-zA-Z0-9.-]+\.loca\.lt' localtunnel.log | head -n 1)
          
          # Convert the https:// prefix to a browser-compliant wss:// websocket link
          WSS_LINK=$(echo "$HTTP_LINK" | sed 's/https:\/\//wss:\/\//')

          echo "=================================================="
          echo "YOUR PERMANENT EAGLERCRAFT SERVER IS LIVE!"
          echo "Copy and paste this link into your client browser:"
          echo "$WSS_LINK"
          echo "=================================================="
          
          # Fallback: log output verification if it fails to parse
          if [ -z "$WSS_LINK" ]; then
            echo "--- RAW TUNNEL LOG STATUS ---"
            cat localtunnel.log
            echo "-----------------------------"
          fi

      # 7. FORCE RUNNER TO STAY ONLINE PERMANENTLY
      - name: Keep Server Alive Permanent
        run: tail -f /dev/null