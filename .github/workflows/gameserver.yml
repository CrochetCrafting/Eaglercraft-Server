name: 24-7 GitHub Game Server

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java (For EaglerXServer)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Set up Node.js (For Tunneling Installer)
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install and Configure Ngrok
      run: |
        npm install -g ngrok
        ngrok config add-authtoken ${{ secrets.NGROK_AUTHTOKEN }}

    - name: Start Network Tunnel
      run: |
        ngrok tcp 25565 --log=stdout > ngrok.log &
        sleep 15
        echo "=== YOUR SERVER IP ADDRESS IS BELOW ==="
        curl -s http://127.0.0 | grep -o 'tcp://[^"]*' || echo "Tunnel loading... Check ngrok.log if blank"
        echo "======================================="

    - name: Start Game Server
      run: |
        # Automatically finds where EaglerXRewind.jar is hidden and changes directory to it
        JAR_PATH=$(find . -name "EaglerXRewind.jar" -print -quit)
        if [ -n "$JAR_PATH" ]; then
          cd "$(dirname "$JAR_PATH")"
          echo "Found jar file! Starting server inside: $(pwd)"
          java -Xmx6G -Xms6G -jar EaglerXRewind.jar
        else
          echo "CRITICAL ERROR: Could not find EaglerXRewind.jar anywhere in the repository!"
          exit 1
        fi

    - name: Auto-Save World Progress Back to GitHub
      if: always()
      run: |
        git config --global user.name "GitHub Action Server"
        git config --global user.email "action@github.com"
        git add .
        git commit -m "Auto-save world data and inventories [skip ci]" || exit 0
        git push origin main || git push origin main --force
