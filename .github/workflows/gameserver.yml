name: Eaglercraft Permanent Server

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Node.js for LocalTunnel
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Start Game Server and Inject Tunnel
        run: |
          cd ${{ github.workspace }}
          
          # 1. Force EULA to true
          echo "eula=true" > eula.txt

          # 2. Force server.properties configuration bindings
          if [ -f server.properties ]; then
            sed -i 's/server-ip=.*/server-ip=0.0.0.0/g' server.properties
            sed -i 's/online-mode=.*/online-mode=false/g' server.properties
          fi

          # 3. CRUCIAL FIX: Force listeners.yml to accept cross-origin web requests from onrender
          # This appends the origin allowance settings right to the file layout dynamically
          if [ -f plugins/EaglercraftXServer/listeners.yml ]; then
            echo "origin_rules:" >> plugins/EaglercraftXServer/listeners.yml
            echo "  allow_all: true" >> plugins/EaglercraftXServer/listeners.yml
            echo "  origins:" >> plugins/EaglercraftXServer/listeners.yml
            echo "    - '*'" >> plugins/EaglercraftXServer/listeners.yml
            echo "Forced wildcard origin rules inside listeners.yml"
          fi

          # 4. Make launch script executable and boot the server
          chmod +x ./run.sh
          ./run.sh &
          
          # 5. Wait until the server is fully booted on port 25565
          echo "Waiting for Eaglercraft to bind to port 25565..."
          until nc -z 127.0.0.1 25565; do
            printf '.'
            sleep 3
          done
          echo "Server is successfully running!"

          # 6. Install localtunnel globally
          npm install -g localtunnel

          # 7. Start the tunnel pointing directly to the local network adapter interface
          lt --local-host 127.0.0.1 --port 25565 > localtunnel.log 2>&1 &
          
          # Give the tunnel a few seconds to stabilize
          sleep 10
          
          # 8. Extract the link and build your compliant WSS link
          HTTP_LINK=$(grep -oE 'https://[a-zA-Z0-9.-]+\.loca\.lt' localtunnel.log | head -n 1)
          WSS_LINK=$(echo "$HTTP_LINK" | sed 's/https:\/\//wss:\/\//')

          echo "=================================================="
          echo "YOUR PERMANENT EAGLERCRAFT SERVER IS LIVE!"
          echo "Copy and paste this link into your client browser:"
          echo "$WSS_LINK"
          echo "=================================================="

      # 9. FORCE RUNNER TO STAY ONLINE PERMANENTLY
      - name: Keep Server Alive Permanent
        run: tail -f /dev/null