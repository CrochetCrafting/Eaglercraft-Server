name: 24-7 GitHub Game Server

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java (For EaglerXServer)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Start Game Server and Bore Tunnel
      run: |
        # Download and extract the official open-source standalone Bore binary tool
        curl -fsSL https://github.com | tar -zxf -
        chmod +x bore
        sudo mv bore /usr/local/bin/

        # Start the background network tunnel mapping port 25565 straight to public servers
        bore local 25565 --to bore.pub > bore.log &
        
        # Wait for the tunnel metadata to populate cleanly
        sleep 10
        echo "========================================="
        echo "=== YOUR SERVER IP ADDRESS IS BELOW ==="
        cat bore.log | grep -o 'bore.pub:[0-9]*' || echo "Look inside bore.log if blank"
        echo "========================================="

        # Scan for your jar and initialize the game world sequence
        JAR_PATH=$(find . -not -path '*/plugins/*' -name "*.jar" -print -quit)
        if [ -n "$JAR_PATH" ]; then
          cd "$(dirname "$JAR_PATH")"
          echo "Found main runnable jar file: $JAR_PATH"
          echo "eula=true" > eula.txt
          java -Xmx6G -Xms6G -jar "$(basename "$JAR_PATH")"
        else
          echo "CRITICAL ERROR: Could not find any main runnable .jar server file!"
          exit 1
        fi

    - name: Auto-Save World Progress Back to GitHub
      if: always()
      run: |
        git config --global user.name "GitHub Action Server"
        git config --global user.email "action@github.com"
        git add .
        git reset .github/workflows/
        git commit -m "Auto-save world data and inventories [skip ci]" || exit 0
        git push origin main --force