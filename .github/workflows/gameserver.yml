name: 24-7 GitHub Game Server

on:
  workflow_dispatch:

permissions:
  contents: write
  workflows: write # Explicitly forces workflow update permissions

jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java (For EaglerXServer)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install and Configure Localtonet
      run: |
        curl -L "https://localtonet.com" -o localtonet
        chmod +x localtonet
        sudo mv localtonet /usr/local/bin/

    - name: Start Network Tunnel
      run: |
        localtonet authtoken ${{ secrets.LOCALTONET_TOKEN }} &
        sleep 5
        localtonet tcp --port 25565 > localtonet.log &
        sleep 15
        echo "=== CHECK LOGS FOR YOUR CONNECTION IP ==="
        cat localtonet.log | grep -i "Server started" || echo "Look inside the Start Game Server console logs below for connection path info."
        echo "========================================="

    - name: Start Game Server
      run: |
        JAR_PATH=$(find . -not -path '*/plugins/*' -name "*.jar" -print -quit)
        if [ -n "$JAR_PATH" ]; then
          cd "$(dirname "$JAR_PATH")"
          echo "Found main runnable jar file: $JAR_PATH"
          echo "Starting server inside: $(pwd)"
          
          echo "eula=true" > eula.txt
          
          java -Xmx6G -Xms6G -jar "$(basename "$JAR_PATH")"
        else
          echo "CRITICAL ERROR: Could not find any main runnable .jar server file outside of the plugins folder!"
          exit 1
        fi

    - name: Auto-Save World Progress Back to GitHub
      if: always()
      run: |
        git config --global user.name "GitHub Action Server"
        git config --global user.email "action@github.com"
        # Only save game data files, avoid saving workflow config changes back into the repo
        git add .
        git reset .github/workflows/
        git commit -m "Auto-save world data and inventories [skip ci]" || exit 0
        git push origin main --force
