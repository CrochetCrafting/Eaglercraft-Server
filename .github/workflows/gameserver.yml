name: 24-7 GitHub Game Server

on:
  workflow_dispatch: # Allows you to start it manually via a button click

jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java (For EaglerXServer)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install and Configure Ngrok
      run: |
        # Download and extract the official standalone Linux binary directly
        curl -fsSL https://bin.ngrok.com/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz | tar -xz
        sudo mv ngrok /usr/local/bin/
        ngrok config add-authtoken ${{ secrets.NGROK_AUTHTOKEN }}

    - name: Start Network Tunnel
      run: |
        # Launches the ngrok tunnel on port 25565
        ngrok tcp --region=us 25565 --log=stdout > ngrok.log &
        sleep 5
        echo "=== YOUR SERVER IP ADDRESS IS BELOW ==="
        curl -s http://127.0.0 | grep -o 'tcp://[^"]*'
        echo "======================================="

    - name: Start Game Server
      run: |
        java -Xmx6G -Xms6G -jar EaglerXRewind.jar

    - name: Auto-Save World Progress Back to GitHub
      if: always()
      run: |
        git config --global user.name "GitHub Action Server"
        git config --global user.email "action@github.com"
        git add .
        git commit -m "Auto-save world data and inventories [skip ci]" || exit 0
        git push
