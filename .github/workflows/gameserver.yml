name: 24-7 GitHub Game Server

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java (For EaglerXServer)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Install Secure Bore Engine
      run: |
        # Download verified release from a direct alternative mirror source
        curl -fsSL https://github.com -o bore.tar.gz
        tar -xzf bore.tar.gz
        chmod +x bore
        sudo mv bore /usr/local/bin/
        rm bore.tar.gz

    - name: Start Network Tunnel
      run: |
        # Launch the local mapping layer to map the proxy game stream outward
        bore local 25565 --to bore.pub > bore.log &
        sleep 10
        echo "========================================="
        echo "=== YOUR SERVER IP ADDRESS IS BELOW ==="
        cat bore.log | grep -o 'bore.pub:[0-9]*' || echo "Tunnel loading... check the runtime logs."
        echo "========================================="

    - name: Start Game Server
      run: |
        JAR_PATH=$(find . -not -path '*/plugins/*' -name "*.jar" -print -quit)
        if [ -n "$JAR_PATH" ]; then
          cd "$(dirname "$JAR_PATH")"
          echo "Found main runnable jar file: $JAR_PATH"
          echo "eula=true" > eula.txt
          java -Xmx6G -Xms6G -jar "$(basename "$JAR_PATH")"
        else
          echo "CRITICAL ERROR: Could not find any main runnable .jar server file!"
          exit 1
        fi

    - name: Auto-Save World Progress Back to GitHub
      if: always()
      run: |
        git config --global user.name "GitHub Action Server"
        git config --global user.email "action@github.com"
        git add .
        git reset .github/workflows/
        git commit -m "Auto-save world data and inventories [skip ci]" || exit 0
        git push origin main --force