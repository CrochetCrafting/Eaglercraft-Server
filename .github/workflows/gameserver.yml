name: Localhost Workflow

on: [push]

jobs:
  run-localhost:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Install your dependencies here (e.g., npm install / pip install)

      - name: Start Server and Run Tests (The Fix)
        run: |
          # 1. Start your app in the background
          npm run start & 
          
          # 2. Force GitHub to wait until localhost is actually listening
          echo "Waiting for localhost to wake up..."
          until $(curl --output /dev/null --silent --head --fail http://localhost:3000); do
            printf '.'
            sleep 1
          done
          echo "Localhost is up and running!"
          
          # 3. Run whatever commands you need to hit localhost
          curl http://localhost:3000/api/endpoint
          
          # 4. OPTIONAL: If you want to keep the GitHub Action running forever (permanent until timeout)
          # tail -f /dev/null