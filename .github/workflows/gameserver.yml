name: Eaglercraft Server Workflow

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Start Game Server and Keep Alive
        run: |
          cd ${{ github.workspace }}
          
          # Make the run script executable just in case
          chmod +x ./run.sh
          
          # 1. Start the server using your repository's native run script
          ./run.sh &
          
          # 2. Wait for the server port to open
          echo "Waiting for Eaglercraft server to bind to port..."
          until nc -z localhost 25565; do
            printf '.'
            sleep 3
          done
          echo "Server is successfully running on localhost!"
          
          # 3. Force the runner to stay online permanently
          tail -f /dev/null