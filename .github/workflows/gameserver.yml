name: Eaglercraft Permanent Server

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Node.js for WebSocket Translation Bridge
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Start Game Server and Inject Tunnel
        run: |
          cd ${{ github.workspace }}
          
          # 1. Force EULA to true
          echo "eula=true" > eula.txt

          # 2. Force server.properties configuration to offline mode
          if [ -f server.properties ]; then
            sed -i 's/server-ip=.*/server-ip=0.0.0.0/g' server.properties
            sed -i 's/online-mode=.*/online-mode=false/g' server.properties
          fi

          # 3. THE FIX: Temporarily remove AuthMe so it doesn't reject browser handshakes
          # This deletes any AuthMe jar files from the temporary runtime runner folder
          if [ -d plugins ]; then
            rm -f plugins/AuthMe*.jar
            rm -f plugins/authme*.jar
            echo "Temporarily disabled AuthMe to allow Eaglercraft handshakes!"
          fi

          # 4. Make your launch script executable and boot the server
          chmod +x ./run.sh
          ./run.sh &
          
          # 5. Wait until the server is fully booted on port 25565
          echo "Waiting for Paper server to bind to port 25565..."
          until nc -z 127.0.0.1 25565; do
            printf '.'
            sleep 3
          done
          echo "Base server is successfully running!"

          # 6. Build a dynamic Node.js WebSocket translation listener on port 8080
          cat << 'EOF' > proxy.js
          const WebSocket = require('ws');
          const net = require('net');
          const wss = new WebSocket.Server({ port: 8080 });

          wss.on('connection', (ws) => {
              const client = net.createConnection({ port: 25565, host: '127.0.0.1' });
              ws.on('message', (msg) => { client.write(msg); });
              client.on('data', (data) => { ws.send(data); });
              ws.on('close', () => { client.end(); });
              client.on('end', () => { ws.terminate(); });
              ws.on('error', () => {}); client.on('error', () => {});
          });
          console.log('WebSocket translation bridge active on port 8080');
          EOF

          # Install WebSocket module and execute the proxy script in the background
          npm install ws
          node proxy.js &
          sleep 3

          # 7. Install localtunnel globally
          npm install -g localtunnel

          # 8. Start the tunnel targeting the translation bridge port (8080)
          lt --local-host 127.0.0.1 --port 8080 > localtunnel.log 2>&1 &
          
          # Give the tunnel a few seconds to stabilize
          sleep 10
          
          # 9. Extract the link and build your compliant WSS link
          HTTP_LINK=$(grep -oE 'https://[a-zA-Z0-9.-]+\.loca\.lt' localtunnel.log | head -n 1)
          WSS_LINK=$(echo "$HTTP_LINK" | sed 's/https:\/\//wss:\/\//')

          echo "=================================================="
          echo "YOUR PERMANENT EAGLERCRAFT SERVER IS LIVE!"
          echo "Copy and paste this link into your client browser:"
          echo "$WSS_LINK"
          echo "=================================================="

      # 10. FORCE RUNNER TO STAY ONLINE PERMANENTLY
      - name: Keep Server Alive Permanent
        run: tail -f /dev/null