name: Eaglercraft Permanent Server

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Node.js for WebSocket Gateway
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Start Game Server and Setup Proxy
        run: |
          cd ${{ github.workspace }}
          
          # 1. Force EULA to true
          echo "eula=true" > eula.txt

          # 2. Force server.properties configuration to offline mode
          if [ -f server.properties ]; then
            sed -i 's/server-ip=.*/server-ip=0.0.0.0/g' server.properties
            sed -i 's/online-mode=.*/online-mode=false/g' server.properties
          fi

          # 3. Temporarily remove AuthMe so it doesn't reject handshakes
          if [ -d plugins ]; then
            rm -f plugins/AuthMe*.jar
            rm -f plugins/authme*.jar
          fi

          # 4. Make your launch script executable and boot the server
          chmod +x ./run.sh
          ./run.sh &
          
          # 5. Wait until the server is fully booted on port 25565
          echo "Waiting for Paper server to bind to port 25565..."
          until nc -z 127.0.0.1 25565; do
            printf '.'
            sleep 3
          done
          echo "Base server is successfully running!"

          # 6. Build the binary-unwrapping WebSocket translation protocol engine
          cat << 'EOF' > stable_eagler_bridge.js
          const WebSocket = require('ws');
          const net = require('net');
          const wss = new WebSocket.Server({ port: 8080 });

          wss.on('connection', (ws) => {
              const mcSocket = net.createConnection({ port: 25565, host: '127.0.0.1' });

              ws.on('message', (data) => {
                  if (mcSocket.writable) {
                      const buffer = Buffer.isBuffer(data) ? data : Buffer.from(data);
                      mcSocket.write(buffer);
                  }
              });

              mcSocket.on('data', (data) => {
                  if (ws.readyState === WebSocket.OPEN) {
                      ws.send(data, { binary: true });
                  }
              });

              ws.on('close', () => mcSocket.end());
              mcSocket.on('end', () => ws.close());
              ws.on('error', () => {});
              mcSocket.on('error', () => {});
          });
          console.log('Eaglercraft 1.12 Binary Protocol Translation Bridge Active on Port 8080');
          EOF

          # Install WebSocket module and run the translation proxy bridge in the background
          npm install ws
          node stable_eagler_bridge.js &
          sleep 3

          # 7. Use a reliable native web connection tool (wscat) to establish the link
          npm install -g wscat

          # 8. Download a lightweight, stable, zero-config native binary called hookdeck
          curl -sL https://github.com | tar xz
          
          # Run hookdeck pointing to our local websocket bridge on port 8080
          ./hookdeck listen 8080 eagler-server --source github-actions > hookdeck.log 2>&1 &
          sleep 8

          # 9. Extract the secure HTTPS link and transform it into an Eagler wss:// link
          HTTP_LINK=$(grep -oE 'https://[a-zA-Z0-9.-]+\.hookdeck\.dev' hookdeck.log | head -n 1)
          WSS_LINK=$(echo "$HTTP_LINK" | sed 's/https:\/\//wss:\/\//')

          echo "=================================================="
          echo "YOUR PERMANENT EAGLERCRAFT SERVER IS LIVE!"
          echo "Copy and paste this link into your client browser:"
          echo "$WSS_LINK"
          echo "=================================================="

      # 10. FORCE RUNNER TO STAY ONLINE PERMANENTLY (Moved outside the run block so it cannot skip)
      - name: Keep Server Alive Permanent
        run: tail -f /dev/null