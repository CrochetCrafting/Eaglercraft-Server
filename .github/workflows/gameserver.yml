name: Eaglercraft Permanent Server

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install Node.js for Eagler Proxy
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Start Game Server and Setup Proxy
        run: |
          cd ${{ github.workspace }}
          
          # 1. Force EULA to true
          echo "eula=true" > eula.txt

          # 2. Force server.properties configuration to offline mode
          if [ -f server.properties ]; then
            sed -i 's/server-ip=.*/server-ip=0.0.0.0/g' server.properties
            sed -i 's/online-mode=.*/online-mode=false/g' server.properties
          fi

          # 3. Temporarily remove AuthMe so it doesn't reject handshakes
          if [ -d plugins ]; then
            rm -f plugins/AuthMe*.jar
            rm -f plugins/authme*.jar
          fi

          # 4. Make your launch script executable and boot the server
          chmod +x ./run.sh
          ./run.sh &
          
          # 5. Wait until the server is fully booted on port 25565
          echo "Waiting for Paper server to bind to port 25565..."
          until nc -z 127.0.0.1 25565; do
            printf '.'
            sleep 3
          done
          echo "Base server is successfully running!"

          # 6. Create a fully compliant Eaglercraft protocol WebSocket gateway
          # This script handles the text-based WebSocket frames that Eagler 1.12 requires
          cat << 'EOF' > eagler_proxy.js
          const WebSocket = require('ws');
          const net = require('net');
          const wss = new WebSocket.Server({ port: 8080 });

          wss.on('connection', (ws) => {
              const minecraftServer = net.createConnection({ port: 25565, host: '127.0.0.1' });

              // Send packets from browser to Minecraft server
              ws.on('message', (message, isBinary) => {
                  if (minecraftServer.writable) {
                      // Eaglercraft sends binary data. Handlers must pass raw buffers.
                      const packet = isBinary ? message : Buffer.from(message);
                      minecraftServer.write(packet);
                  }
              });

              // Send packets from Minecraft server back to browser
              minecraftServer.on('data', (data) => {
                  if (ws.readyState === WebSocket.OPEN) {
                      ws.send(data, { binary: true });
                  }
              });

              ws.on('close', () => minecraftServer.end());
              minecraftServer.on('end', () => ws.close());
              ws.on('error', () => {});
              minecraftServer.on('error', () => {});
          });
          console.log('Eaglercraft 1.12 WebSocket Protocol Gateway Active on Port 8080');
          EOF

          # Install WebSocket module and run the proxy gateway in the background
          npm install ws
          node eagler_proxy.js &
          sleep 3

          # 7. Install localtunnel globally
          npm install -g localtunnel

          # 8. Start the tunnel targeting our protocol proxy gateway (8080)
          lt --local-host 127.0.0.1 --port 8080 > localtunnel.log 2>&1 &
          
          # Give the tunnel a few seconds to stabilize
          sleep 10
          
          # 9. Extract the link and build your compliant WSS link
          HTTP_LINK=$(grep -oE 'https://[a-zA-Z0-9.-]+\.loca\.lt' localtunnel.log | head -n 1)
          WSS_LINK=$(echo "$HTTP_LINK" | sed 's/https:\/\//wss:\/\//')

          echo "=================================================="
          echo "YOUR PERMANENT EAGLERCRAFT SERVER IS LIVE!"
          echo "Copy and paste this link into your client browser:"
          echo "$WSS_LINK"
          echo "=================================================="

      # 10. FORCE RUNNER TO STAY ONLINE PERMANENTLY
      - name: Keep Server Alive Permanent
        run: tail -f /dev/null