name: 24-7 GitHub Game Server

on:
  workflow_dispatch: # Allows you to start it manually via a button click

jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java (For Minecraft)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17' # Change to 21 if using newer MC versions

    - name: Install and Configure Ngrok
      run: |
        curl -s https://amazonaws.com | sudo tee /etc/apt/trusted.gpg.d/ngrok.asc >/dev/null
        echo "deb https://amazonaws.com buster main" | sudo tee /etc/apt/sources.list.d/ngrok.list
        sudo apt-get update && sudo apt-get install ngrok
        ngrok config add-authtoken ${{ secrets.NGROK_AUTHTOKEN }}

    - name: Start Network Tunnel
      run: |
        # Launches the ngrok tunnel in the background on Minecraft Java port 25565
        ngrok tcp 25565 --log=stdout > ngrok.log &
        sleep 5
        echo "=== YOUR SERVER IP ADDRESS IS BELOW ==="
        curl -s http://127.0.0 | grep -o 'tcp://[^"]*'
        echo "======================================="

    - name: Start Game Server
      run: |
        # If your server file has a different name (like server.jar), change it below
        java -Xmx6G -Xms6G -jar forge.jar nogui 

    - name: Auto-Save World Progress Back to GitHub
      if: always()
      run: |
        git config --global user.name "GitHub Action Server"
        git config --global user.email "action@github.com"
        git add .
        git commit -m "Auto-save world data and inventories [skip ci]" || exit 0
        git push