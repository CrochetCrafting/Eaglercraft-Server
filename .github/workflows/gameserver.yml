name: Eaglercraft Server Workflow

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          # Removed the cache option to prevent the pom.xml error

      - name: Start Game Server and Keep Alive
        run: |
          # 1. Start your Eaglercraft server in the background
          java -Xmx2G -Xms2G -jar EaglerXRewind.jar nogui &
          
          # 2. Wait for the server port to open (Fixes Connection Refused)
          echo "Waiting for Eaglercraft server to bind to port..."
          until nc -z localhost 25565; do
            printf '.'
            sleep 3
          done
          echo "Server is successfully running on localhost!"
          
          # 3. Force the runner to stay online permanently (Up to GitHub's 6-hour limit)
          tail -f /dev/null
