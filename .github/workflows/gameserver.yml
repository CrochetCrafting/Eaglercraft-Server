name: Start Game Server Tunnel
on: [push, workflow_dispatch]

jobs:
  game-host:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Start your game server script detached in the background
      - name: Start Game Server
        run: |
          chmod +x run.sh
          nohup ./run.sh > server.log 2>&1 &
          echo "Game server process launched."

      # 2. Wait 15 seconds (game servers take a bit longer to boot up)
      - name: Boot Delay
        run: sleep 15

      # 3. Check if your game port is active (look for UDP or TCP bindings)
      - name: Check Active Game Ports
        run: |
          echo "=== Network Interfaces ==="
          sudo ss -tulpn || true
          echo "=== Server Startup Logs ==="
          cat server.log || true

      # 4. Use Bore to tunnel your game port (No signup, handles UDP/TCP)
      - name: Open Game Server Tunnel
        run: |
          wget https://github.com
          tar -xf bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz
          echo "=== YOUR PUBLIC GAME ADDRESS WILL APPEAR BELOW ==="
          ./bore local 25565 --to bore.pub # CHANGE 25565 to your game's actual port