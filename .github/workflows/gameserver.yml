name: 24-7 GitHub Game Server

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  run-server:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Java (For EaglerXServer)
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Start Network Tunnel and Game Server
      run: |
        # Launch a background TCP tunnel using the native Linux SSH utility (no download required)
        # It takes port 25565 and maps it instantly onto a free pinggy network socket route
        ssh -p 443 -o StrictHostKeyChecking=no -o ServerAliveInterval=30 tcp@a.pinggy.io R:25565:localhost:25565 > pinggy.log &
        
        # Give the background network engine a few seconds to populate details cleanly
        sleep 10
        echo "========================================="
        echo "=== YOUR SERVER IP ADDRESS IS BELOW ==="
        cat pinggy.log | grep -o 'a.pinggy.io:[0-9]*' || echo "Tunnel loading... please review the log output streams."
        echo "========================================="

        # Automatically locate your game engine executable and initialize the world matrix
        JAR_PATH=$(find . -not -path '*/plugins/*' -name "*.jar" -print -quit)
        if [ -n "$JAR_PATH" ]; then
          cd "$(dirname "$JAR_PATH")"
          echo "Found main runnable jar file: $JAR_PATH"
          echo "eula=true" > eula.txt
          java -Xmx6G -Xms6G -jar "$(basename "$JAR_PATH")"
        else
          echo "CRITICAL ERROR: Could not find any main runnable .jar server file!"
          exit 1
        fi

    - name: Auto-Save World Progress Back to GitHub
      if: always()
      run: |
        git config --global user.name "GitHub Action Server"
        git config --global user.email "action@github.com"
        git add .
        git reset .github/workflows/
        git commit -m "Auto-save world data and inventories [skip ci]" || exit 0
        git push origin main --force