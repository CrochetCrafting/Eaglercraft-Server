name: Sync to Hugging Face Spaces

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git config --global user.email "git-actions@github.com"
          git config --global user.name "GitHub Actions"
          git push --force https://Kyle-Pou:$HF_TOKEN@huggingface.co/spaces/Kyle-Pou/EaglerServed main